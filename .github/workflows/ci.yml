name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: macos-15
            swift-version: "6.0.3"
            xcode: "16.2"
          - os: macos-15
            swift-version: "6.1.0"
            xcode: "16.3"
          - os: xcode-27
            swift-version: "6.4"
            xcode: "27.0"
          - os: ubuntu-latest
            swift-version: "6.0.3"
            image: swift:6.0.3-noble
          - os: ubuntu-latest
            swift-version: "6.1.0"
            image: swift:6.1.0-noble
          - os: ubuntu-latest
            swift-version: "6.4"
            image: swift:6.4-noble

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    name: Test (${{ matrix.os }}, Swift ${{ matrix.swift-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
